<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Battery outline, same shape as the charge-ceiling icon: these two are the
       ends of one device-wide window -->
  <rect x="5" y="25" width="80" height="50" rx="8" stroke="white"
        stroke-width="5" fill="none"/>
  <!-- Terminal nub -->
  <rect x="88" y="40" width="8" height="20" rx="3" fill="white"/>
  <!-- Fill kept low: this is the level the battery may not go below -->
  <rect x="12" y="32" width="14" height="36" rx="5" fill="#00A94F"/>
</svg>
