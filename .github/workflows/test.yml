name: Test and validate

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  validate:
    name: Validate Homey app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish
